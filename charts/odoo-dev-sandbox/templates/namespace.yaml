{{- $p := .Values.sandbox.labelPrefix | default "dev-sandbox.io" }}
{{- $existingNs := (lookup "v1" "Namespace" "" (include "odoo-dev-sandbox.namespace" .)) }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "odoo-dev-sandbox.namespace" . }}
  labels:
    {{- include "odoo-dev-sandbox.labels" . | nindent 4 }}
    {{ $p }}/managed: "true"
    {{- range $key, $value := .Values.sandbox.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  annotations:
    {{ $p }}/branch: {{ .Values.sandbox.branch | quote }}
    {{ $p }}/ttl: {{ .Values.sandbox.ttl | quote }}
    {{ $p }}/mode: {{ .Values.sandbox.mode | quote }}
    {{- $createdKey := printf "%s/created" $p }}
    {{- if and $existingNs $existingNs.metadata.annotations (index $existingNs.metadata.annotations $createdKey) }}
    {{ $p }}/created: {{ index $existingNs.metadata.annotations $createdKey | quote }}
    {{- else }}
    {{ $p }}/created: {{ now | date "2006-01-02T15:04:05Z" | quote }}
    {{- end }}
    {{- if ne (.Values.sandbox.ttl | toString) "0" }}
    {{ $p }}/expires: {{ now | dateModify .Values.sandbox.ttl | date "2006-01-02T15:04:05Z" | quote }}
    {{- else }}
    {{ $p }}/expires: "never"
    {{- end }}
