{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "odoo-dev-sandbox.secretName" . }}
  namespace: {{ include "odoo-dev-sandbox.namespace" . }}
  labels:
    {{- include "odoo-dev-sandbox.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ .Values.postgres.password | b64enc | quote }}
  postgres-user: {{ .Values.postgres.user | b64enc | quote }}
  postgres-database: {{ include "odoo-dev-sandbox.dbName" . | b64enc | quote }}
  odoo-admin-password: {{ .Values.odoo.adminPassword | b64enc | quote }}
  {{- /* Agent-runtime shared secrets — emitted only when set so the Odoo
        deployment's optional secretKeyRef stays unset (fail-closed) otherwise.
        Keys MUST match odoo-deployment.yaml secretKeyRef keys. */}}
  {{- if .Values.agentRuntime.authSecretCurrent }}
  agent-runtime-auth-secret-current: {{ .Values.agentRuntime.authSecretCurrent | b64enc | quote }}
  {{- end }}
  {{- if .Values.agentRuntime.authSecretPrevious }}
  agent-runtime-auth-secret-previous: {{ .Values.agentRuntime.authSecretPrevious | b64enc | quote }}
  {{- end }}
  {{- if .Values.agentRuntime.webhookSecret }}
  agent-runtime-webhook-secret: {{ .Values.agentRuntime.webhookSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.agentRuntime.webhookSecretPrevious }}
  agent-runtime-webhook-secret-previous: {{ .Values.agentRuntime.webhookSecretPrevious | b64enc | quote }}
  {{- end }}
  {{- if .Values.agentRuntime.namespaceSecret }}
  agent-runtime-namespace-secret: {{ .Values.agentRuntime.namespaceSecret | b64enc | quote }}
  {{- end }}
{{- end }}
