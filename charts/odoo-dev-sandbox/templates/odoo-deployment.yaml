apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "odoo-dev-sandbox.fullname" . }}-odoo
  namespace: {{ include "odoo-dev-sandbox.namespace" . }}
  labels:
    {{- include "odoo-dev-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: odoo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "odoo-dev-sandbox.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: odoo
  template:
    metadata:
      labels:
        {{- include "odoo-dev-sandbox.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: odoo
    spec:
      {{- if eq .Values.sandbox.mode "stg" }}
      imagePullSecrets:
        - name: {{ .Values.registry.secretName | default "image-registry-creds" }}
      {{- end }}
      containers:
        - name: odoo
          image: "{{ .Values.odoo.image.repository }}:{{ .Values.odoo.image.tag }}"
          imagePullPolicy: {{ .Values.odoo.image.pullPolicy }}
          {{- if and (not (eq .Values.sandbox.mode "stg")) (or .Values.odoo.extraPipRequirementsFile .Values.odoo.extraPipPackages) }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              {{- if .Values.odoo.extraPipRequirementsFile }}
              pip3 install --break-system-packages --no-cache-dir -r '{{ .Values.odoo.extraPipRequirementsFile }}' && \
              {{- else }}
              pip3 install --break-system-packages{{- range .Values.odoo.extraPipPackages }} '{{ . }}'{{- end }} && \
              {{- end }}
              exec odoo{{ if .Values.odoo.devMode }} --dev reload,qweb,xml{{ end }}{{ if .Values.odoo.updateModules }} -u {{ .Values.odoo.updateModules }}{{ end }} -c /etc/odoo/odoo.conf
          {{- else }}
          command: ["odoo"]
          args:
            {{- if .Values.odoo.devMode }}
            - "--dev"
            - "reload,qweb,xml"
            {{- end }}
            {{- if .Values.odoo.updateModules }}
            - "-u"
            - {{ .Values.odoo.updateModules | quote }}
            {{- end }}
            - "-c"
            - "/etc/odoo/odoo.conf"
          {{- end }}
          ports:
            - name: http
              containerPort: 8069
              protocol: TCP
            - name: longpolling
              containerPort: 8072
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "odoo-dev-sandbox.secretName" . }}
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "odoo-dev-sandbox.secretName" . }}
                  key: postgres-password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "odoo-dev-sandbox.secretName" . }}
                  key: postgres-database
            # Agent-runtime shared secrets (OQ#1 ruling (b) — K8s Secret env
            # injection). Frozen env names; consumed by the skill-bundle /
            # webhook / namespace-hash code paths (flag-gated by
            # project.use_agent_runtime, so optional for sandboxes that don't
            # enable it — a missing key leaves the env unset, which fails closed
            # only when the agent-runtime path actually runs).
            - name: AGENT_RUNTIME_AUTH_SECRET_CURRENT
              valueFrom:
                secretKeyRef:
                  name: {{ include "odoo-dev-sandbox.secretName" . }}
                  key: agent-runtime-auth-secret-current
                  optional: true
            - name: AGENT_RUNTIME_AUTH_SECRET_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ include "odoo-dev-sandbox.secretName" . }}
                  key: agent-runtime-auth-secret-previous
                  optional: true
            - name: AGENT_RUNTIME_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "odoo-dev-sandbox.secretName" . }}
                  key: agent-runtime-webhook-secret
                  optional: true
            - name: AGENT_RUNTIME_WEBHOOK_SECRET_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ include "odoo-dev-sandbox.secretName" . }}
                  key: agent-runtime-webhook-secret-previous
                  optional: true
            - name: AGENT_RUNTIME_NAMESPACE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "odoo-dev-sandbox.secretName" . }}
                  key: agent-runtime-namespace-secret
                  optional: true
            # AI runtime key (optional). src/models/ai_client.py reads this as a
            # fallback when the ai.config record has no api_key. Missing key →
            # env unset → AI raises at call time (fail-closed) / AI e2e skips.
            - name: WOOW_AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "odoo-dev-sandbox.secretName" . }}
                  key: woow-ai-api-key
                  optional: true
          volumeMounts:
            - name: odoo-config
              mountPath: /etc/odoo/odoo.conf
              subPath: odoo.conf
              readOnly: true
            {{- if .Values.odoo.filestore.persistence.enabled }}
            - name: odoo-filestore
              {{- if eq .Values.sandbox.mode "stg" }}
              mountPath: /root/.local/share/Odoo
              {{- else }}
              mountPath: /var/lib/odoo
              {{- end }}
            {{- end }}
            {{- if eq .Values.sandbox.mode "local" }}
            {{- if .Values.codeMount.mounts }}
            {{- range $i, $m := .Values.codeMount.mounts }}
            - name: code-mount-{{ $i }}
              mountPath: {{ if $.Values.codeMount.mountWholeDir }}/mnt/extra-addons{{ else }}/mnt/extra-addons/{{ $m.mountSubdir }}{{ end }}
            {{- end }}
            {{- else }}
            - name: extra-addons
              mountPath: /mnt/extra-addons/{{ .Values.codeMount.moduleName }}
            {{- end }}
            {{- if .Values.codeMount.extraMounts }}
            {{- range $i, $e := .Values.codeMount.extraMounts }}
            - name: extra-mount-{{ $i }}
              mountPath: {{ $e.containerPath }}
            {{- end }}
            {{- else if .Values.codeMount.extraAddonsHostPath }}
            - name: extra-addons-ext
              mountPath: /mnt/extra-addons-ext
            {{- end }}
            {{- end }}
          {{- with .Values.odoo.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.odoo.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.odoo.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: odoo-config
          configMap:
            name: {{ include "odoo-dev-sandbox.fullname" . }}-odoo-config
        {{- if .Values.odoo.filestore.persistence.enabled }}
        - name: odoo-filestore
          persistentVolumeClaim:
            claimName: {{ include "odoo-dev-sandbox.fullname" . }}-odoo-filestore
        {{- end }}
        {{- if eq .Values.sandbox.mode "local" }}
        {{- if .Values.codeMount.mounts }}
        {{- range $i, $m := .Values.codeMount.mounts }}
        - name: code-mount-{{ $i }}
          hostPath:
            path: {{ $m.hostPath }}
            type: Directory
        {{- end }}
        {{- else }}
        - name: extra-addons
          hostPath:
            path: {{ .Values.codeMount.hostPath }}
            type: Directory
        {{- end }}
        {{- if .Values.codeMount.extraMounts }}
        {{- range $i, $e := .Values.codeMount.extraMounts }}
        - name: extra-mount-{{ $i }}
          hostPath:
            path: {{ $e.hostPath }}
            type: Directory
        {{- end }}
        {{- else if .Values.codeMount.extraAddonsHostPath }}
        - name: extra-addons-ext
          hostPath:
            path: {{ .Values.codeMount.extraAddonsHostPath }}
            type: Directory
        {{- end }}
        {{- end }}
