{{- if .Values.odoo.filestore.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "odoo-dev-sandbox.fullname" . }}-odoo-filestore
  namespace: {{ include "odoo-dev-sandbox.namespace" . }}
  labels:
    {{- include "odoo-dev-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: odoo
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.odoo.filestore.persistence.storageClass }}
  storageClassName: {{ .Values.odoo.filestore.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.odoo.filestore.persistence.size }}
{{- end }}
