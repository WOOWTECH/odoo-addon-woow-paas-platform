# STG mode overrides
# Usage: helm install ... -f values.yaml -f values-ci.yaml

sandbox:
  mode: stg

odoo:
  image:
    repository: woow-odoo-dev
    tag: latest
  devMode: false
  # Disable Odoo process limits in STG — let K8s resource limits control
  processLimits:
    memoryHard: 0
    memorySoft: 0
    timeCpu: 0
    timeReal: 0

ingress:
  enabled: false

pgadmin:
  enabled: false

networkPolicy:
  enabled: true
  allowIngressFromNamespaces:
    - paas-stg-cloudflare-system
  allowEgressToNamespaces:
    - paas-stg-system
