# Default values for odoo-dev-sandbox

# --- Sandbox Configuration ---
sandbox:
  # Deployment mode: "local" (hostPath mount), "ci-local" (CI image, local addons path), "stg" (STG image, baked addons)
  mode: local
  # Time-to-live before auto-cleanup (e.g., "168h" = 7 days, "0" = never)
  ttl: "168h"
  # Git branch slug (used for namespace naming)
  branch: ""
  # Labels applied to the sandbox namespace
  labels:
    sandbox.woow.tw/managed: "true"

# --- Namespace ---
namespace:
  # If empty, computed as "dev-sandbox-{branch}"
  name: ""

# --- Odoo ---
odoo:
  image:
    repository: odoo
    tag: "18.0"
    pullPolicy: IfNotPresent
  # Enable Odoo dev mode (reload,qweb,xml)
  devMode: true
  # Admin master password
  adminPassword: admin
  # Install Python packages from requirements.txt at container startup (single source of truth)
  # Path inside the container to a pip requirements file
  extraPipRequirementsFile: /mnt/extra-addons/woow_paas_platform/requirements.txt
  # Fallback: list individual packages (used only when extraPipRequirementsFile is empty)
  extraPipPackages: []
  # Modules to update on startup (comma-separated, e.g. "web,woow_paas_platform")
  # Uses -u (update) which is idempotent and safe for restarts.
  # Empty string means no explicit module update (Odoo starts normally).
  updateModules: ""
  # Addons path inside container
  addonsPath: /mnt/extra-addons,/mnt/extra-addons-ext
  # Filestore persistence (recommended for stg mode)
  filestore:
    persistence:
      enabled: true
      size: 2Gi
      storageClass: ""
  # Odoo internal process limits
  # These control virtual memory (VmSize), NOT physical memory (RSS).
  # AI libraries (onnxruntime, fastembed, numpy) reserve large virtual
  # address space via mmap. If memoryHard < VmSize, thread creation
  # (clone syscall) fails with "can't start new thread".
  # Keep memoryHard >= container memory limit to avoid false positives.
  processLimits:
    memoryHard: 6442450944   # 6 GB
    memorySoft: 4294967296   # 4 GB
    timeCpu: 600
    timeReal: 1200
  # Resource limits
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 2Gi
  # Readiness probe (TCP to avoid circular dependency with DB init)
  readinessProbe:
    tcpSocket:
      port: 8069
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 12
  # Liveness probe (TCP: more robust for dev sandbox with pip install at startup)
  # NOTE: Local/CI-local modes run pip install at startup (fastembed + onnxruntime
  # ~200MB+, can take 5-10 min). STG mode skips pip (baked into image).
  livenessProbe:
    tcpSocket:
      port: 8069
    initialDelaySeconds: 600
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

# --- PostgreSQL ---
postgres:
  enabled: true
  image:
    repository: pgvector/pgvector
    tag: "pg15"
    pullPolicy: IfNotPresent
  # Database name (auto-generated from branch if empty)
  database: ""
  user: odoo
  password: odoo
  storage:
    size: 5Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi

# --- Nginx ---
nginx:
  enabled: true
  image:
    repository: nginx
    tag: alpine
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# --- PgAdmin (optional) ---
pgadmin:
  enabled: false
  image:
    repository: dpage/pgadmin4
    tag: latest
    pullPolicy: IfNotPresent
  defaultEmail: admin@woow.com
  defaultPassword: admin
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# --- Ingress ---
ingress:
  enabled: false
  className: traefik
  # Domain pattern: {sandbox-name}.woowtech.io
  domain: woowtech.io
  annotations: {}
  tls: []

# --- Code mount (local mode) ---
codeMount:
  # Absolute path on the host to the worktree src/ directory
  hostPath: ""
  # Odoo module name (used as subdirectory under /mnt/extra-addons/)
  moduleName: woow_paas_platform
  # Absolute path on the host to extra-addons directory
  extraAddonsHostPath: ""

# --- TTL Cleanup CronJob ---
# 每小時跑一次、刪除過期 sandbox namespace 的 image。需具備：kubectl + POSIX
# shell（/bin/sh）+ GNU `date -d`（解析 ISO 8601 的 expires annotation）。
# 預設 pin Bitnami *legacy* archive tag：原本的 `bitnami/kubectl:latest` 在
# 2025-08 Bitnami community image 凍結後已搬到 `bitnamilegacy/`，凍結 repo 上的
# `:latest` 會 pull 不到 → TTL 自動清理 ImagePullBackOff 靜默失效（過期 sandbox
# 永不刪除）。bitnamilegacy 維持 Debian-12/glibc 底層，GNU date 的到期判斷邏輯
# 逐字不變、零風險。若要完全脫離 Bitnami，可覆寫成其它含 shell + GNU date 的
# kubectl image（注意：rancher/kubectl 與 alpine 系用 busybox date，ISO 8601
# 解析行為不同，切換前須先驗證 expires 判斷仍正確）。
ttl:
  image:
    repository: bitnamilegacy/kubectl
    tag: "1.33.4-debian-12-r0"
    pullPolicy: IfNotPresent

# --- Resource Quota ---
resourceQuota:
  enabled: true
  cpu: "4"
  memory: 8Gi
  storage: 10Gi

# --- Network Policy ---
networkPolicy:
  enabled: true
  # Allow ingress from specific namespaces (e.g., cloudflare tunnel namespace).
  # Each namespace listed here is automatically mirrored on the egress side
  # too, so reply traffic can return — required because the K3s NetworkPolicy
  # enforcer treats some reply paths as fresh egress and would otherwise drop
  # them once the ipBlock-except rule excludes the cluster pod CIDR. If you
  # ever need ingress without reply egress (rare), don't list it here — add a
  # separate field instead.
  allowIngressFromNamespaces: []
  # Example for STG mode:
  # allowIngressFromNamespaces:
  #   - paas-stg-cloudflare-system

  # Allow egress to specific namespaces the sandbox itself initiates calls to
  # (e.g., paas-operator). One-way; not paired with ingress.
  allowEgressToNamespaces: []
  # Example for STG mode:
  # allowEgressToNamespaces:
  #   - paas-stg-system

  # Let the dynamic agent-runtime pod namespaces (paas-ws-pa-*, labelled
  # paas-managed=true by the operator) talk to Odoo through allow-internal:
  # adds a label-based ingress (pod->odoo skill-bundle) + egress (odoo->pod WS
  # /v1/chat, which also mirrors the ingress for K3s reply traffic). Opt-in
  # (default false) so non-agent-runtime sandboxes are unaffected. Set true for
  # the agent-runtime pilot.
  allowAgentRuntimePods: false

# --- Secret Management ---
secrets:
  # Use an existing K8s secret instead of creating one
  existingSecret: ""

# --- Agent-runtime shared secrets (agent-runtime pilot / Phase D) ---
# Populated into the chart Secret (secrets.yaml) ONLY when set; consumed by
# odoo-deployment.yaml via optional secretKeyRef. For the agent-runtime pilot,
# set authSecretCurrent to the SAME raw HS256 key as the operator's
# AGENT_RUNTIME_AUTH_SECRET_CURRENT so Odoo verifies the operator-signed
# skill_bundle_token (D-CAVEAT-1). Empty = key omitted = env unset (fail-closed
# when the agent-runtime path runs). Set at deploy via --set (do not commit).
agentRuntime:
  authSecretCurrent: ""
  authSecretPrevious: ""
  webhookSecret: ""
  webhookSecretPrevious: ""
  namespaceSecret: ""

# --- AI runtime secret ---
# The only genuine external secret (an OpenAI-compatible API key). Populated into
# the chart Secret (secrets.yaml) ONLY when set; consumed by odoo-deployment.yaml
# via optional secretKeyRef as WOOW_AI_API_KEY, which src/models/ai_client.py reads
# as a fallback when the ai.config record has no key. Empty = key omitted = env
# unset → AI calls raise at call time (fail-closed) / AI e2e skips gracefully.
# Set at deploy via --set aiRuntime.apiKey=... (do NOT commit a real key).
aiRuntime:
  apiKey: ""

# --- Registry credentials (stg mode) ---
registry:
  # Docker registry server
  server: ""
  # Username for docker login
  username: ""
  # Password for docker login
  password: ""

# --- Common overrides ---
nameOverride: ""
fullnameOverride: ""
