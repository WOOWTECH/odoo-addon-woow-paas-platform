# Default values for odoo-dev-sandbox

# --- Sandbox Configuration ---
sandbox:
  # Deployment mode: "local" (hostPath mount), "ci-local" (CI image, local addons path), "stg" (STG image, baked addons)
  mode: local
  # Time-to-live before auto-cleanup (e.g., "168h" = 7 days, "0" = never)
  ttl: "168h"
  # Git branch slug (used for namespace naming)
  branch: ""
  # Labels applied to the sandbox namespace
  labels:
    sandbox.woow.tw/managed: "true"

# --- Namespace ---
namespace:
  # If empty, computed as "dev-sandbox-{branch}"
  name: ""

# --- Odoo ---
odoo:
  image:
    repository: odoo
    tag: "18.0"
    pullPolicy: IfNotPresent
  # Enable Odoo dev mode (reload,qweb,xml)
  devMode: true
  # Admin master password
  adminPassword: admin
  # Install Python packages from requirements.txt at container startup (single source of truth)
  # Path inside the container to a pip requirements file
  extraPipRequirementsFile: /mnt/extra-addons/woow_paas_platform/requirements.txt
  # Fallback: list individual packages (used only when extraPipRequirementsFile is empty)
  extraPipPackages: []
  # Addons path inside container
  addonsPath: /mnt/extra-addons,/mnt/extra-addons-ext
  # Resource limits
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 2Gi
  # Readiness probe (TCP to avoid circular dependency with DB init)
  readinessProbe:
    tcpSocket:
      port: 8069
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 12
  # Liveness probe (TCP: more robust for dev sandbox with pip install at startup)
  # NOTE: fastembed + onnxruntime dependencies are large (~200MB+), pip install
  # can take 5-10 min on slow networks. Set initialDelaySeconds accordingly.
  livenessProbe:
    tcpSocket:
      port: 8069
    initialDelaySeconds: 600
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

# --- PostgreSQL ---
postgres:
  enabled: true
  image:
    repository: pgvector/pgvector
    tag: "pg15"
    pullPolicy: IfNotPresent
  # Database name (auto-generated from branch if empty)
  database: ""
  user: odoo
  password: odoo
  storage:
    size: 5Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi

# --- Nginx ---
nginx:
  enabled: true
  image:
    repository: nginx
    tag: alpine
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# --- PgAdmin (optional) ---
pgadmin:
  enabled: false
  image:
    repository: dpage/pgadmin4
    tag: latest
    pullPolicy: IfNotPresent
  defaultEmail: admin@woow.com
  defaultPassword: admin
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# --- Ingress ---
ingress:
  enabled: false
  className: traefik
  # Domain pattern: {sandbox-name}.woowtech.io
  domain: woowtech.io
  annotations: {}
  tls: []

# --- Code mount (local mode) ---
codeMount:
  # Absolute path on the host to the worktree src/ directory
  hostPath: ""
  # Odoo module name (used as subdirectory under /mnt/extra-addons/)
  moduleName: woow_paas_platform
  # Absolute path on the host to extra-addons directory
  extraAddonsHostPath: ""

# --- Resource Quota ---
resourceQuota:
  enabled: true
  cpu: "4"
  memory: 4Gi
  storage: 10Gi

# --- Network Policy ---
networkPolicy:
  enabled: true
  # Allow egress to specific namespaces (e.g., paas-operator namespace)
  allowEgressToNamespaces: []
  # Example for STG mode:
  # allowEgressToNamespaces:
  #   - paas-stg-system

# --- Secret Management ---
secrets:
  # Use an existing K8s secret instead of creating one
  existingSecret: ""

# --- Registry credentials (stg mode) ---
registry:
  # Docker registry server
  server: ""
  # Username for docker login
  username: ""
  # Password for docker login
  password: ""

# --- Common overrides ---
nameOverride: ""
fullnameOverride: ""
