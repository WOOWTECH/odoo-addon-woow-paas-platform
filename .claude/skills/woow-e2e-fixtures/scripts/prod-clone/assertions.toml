# prod clone 中和斷言 fixture（#1206 交付 2；裁決 #1162 留言 14057 D10）
#
# ⚠ 第一次彩排前由人審 commit；改這份檔案＝改 gate，PR 必須有人覆核。
# expected 取自 #1200 的 prod 量測（留言 14397）：那是「中和前」的值，這裡寫的是「中和後必須成立」的值。
#
# 欄位（schema 固定）：
#   check_id  唯一 ID；前綴＝#1162 的層：A 排程、B 外連、C 身分、D 進入面、E 租戶憑證、P PII、K 網路／叢集、I 只記錄
#   table     查詢的主表；表不存在時依 when_absent 判定（預設 fail——表名打錯不得靜默通過）
#   columns   （選填）必須存在的欄位；任一缺席同 table 缺席處理（vendored 欄位改名會落在這裡）
#   query     單一純量的 SELECT；kind="builtin" 時是腳本內建檢查的名字
#   expected  比對值（字串相等）；可加前綴 >=、<=、>、<、!=（數值比較）；"*" 只記錄不判定
#   kind      （選填）"sql"（預設）｜"builtin"
#   when_absent（選填）"fail"（預設）｜"pass"（該 addon 在 prod 未安裝，#1200 已確認）
#   note      （選填）說明
#
# 執行：seed-from-prod.sh gate <slug>（或 neutralize-clone.sh 結尾自動跑）。輸出只有 count／聚合，不含資料值。

# ───── 先決條件 ─────
[[check]]
check_id = "A00_is_neutralized"
table = "ir_config_parameter"
query = "SELECT coalesce((SELECT lower(value) FROM ir_config_parameter WHERE key = 'database.is_neutralized'), '<missing>')"
expected = "true"
note = "先於 IAP 斷言：iap_account 的 +disabled 綁定 is_neutralized"

