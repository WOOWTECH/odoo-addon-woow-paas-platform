{{- if .Values.pvcCleanup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "paas-operator.fullname" . }}-pvc-cleanup
  labels:
    {{- include "paas-operator.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.pvcCleanup.schedule | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            {{- include "paas-operator.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: pvc-cleanup
        spec:
          serviceAccountName: {{ include "paas-operator.serviceAccountName" . }}
          restartPolicy: Never
          containers:
            - name: pvc-cleanup
              image: "{{ .Values.pvcCleanup.image.repository }}:{{ .Values.pvcCleanup.image.tag }}"
              {{- with .Values.pvcCleanup.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              env:
                - name: NAMESPACE_PREFIX
                  value: {{ .Values.config.namespacePrefix | quote }}
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "=== PVC Cleanup Job Started: $(date -u) ==="
                  DELETED_PVC=0
                  DELETED_PV=0
                  NS_PREFIX="${NAMESPACE_PREFIX}"

                  # ─── Part 1: Delete expired orphaned PVCs ───
                  echo "--- Scanning for orphaned PVCs ---"
                  PVCS_JSON=$(kubectl get pvc --all-namespaces \
                    -l paas.woowtech.io/orphaned-at \
                    -o jsonpath='{range .items[*]}{.metadata.namespace}{"\t"}{.metadata.name}{"\t"}{.metadata.labels.paas\.woowtech\.io/orphaned-at}{"\t"}{.metadata.labels.paas\.woowtech\.io/grace-period-days}{"\n"}{end}' 2>/dev/null || true)

                  if [ -n "$PVCS_JSON" ]; then
                    echo "$PVCS_JSON" | while IFS="$(printf '\t')" read -r NS PVC_NAME ORPHANED_AT GRACE_DAYS; do
                      [ -z "$NS" ] && continue
                      GRACE_DAYS=${GRACE_DAYS:-7}

                      # Parse orphaned-at timestamp to epoch
                      ORPHANED_EPOCH=$(date -d "$ORPHANED_AT" +%s 2>/dev/null || echo "")
                      if [ -z "$ORPHANED_EPOCH" ]; then
                        echo "WARN: Cannot parse orphaned-at for $NS/$PVC_NAME: $ORPHANED_AT"
                        continue
                      fi

                      GRACE_SECONDS=$((GRACE_DAYS * 86400))
                      EXPIRY_EPOCH=$((ORPHANED_EPOCH + GRACE_SECONDS))
                      NOW_EPOCH=$(date +%s)

                      if [ "$NOW_EPOCH" -ge "$EXPIRY_EPOCH" ]; then
                        echo "DELETE PVC: $NS/$PVC_NAME (orphaned $ORPHANED_AT, grace ${GRACE_DAYS}d)"
                        kubectl delete pvc "$PVC_NAME" -n "$NS" --wait=false && DELETED_PVC=$((DELETED_PVC + 1))
                      else
                        REMAINING=$(( (EXPIRY_EPOCH - NOW_EPOCH) / 86400 ))
                        echo "KEEP PVC: $NS/$PVC_NAME (${REMAINING}d remaining)"
                      fi
                    done
                  else
                    echo "No orphaned PVCs found"
                  fi

                  # ─── Part 2: Clean up Released PVs from paas-ws-* namespaces ───
                  echo "--- Scanning for Released PVs ---"
                  RELEASED_PVS=$(kubectl get pv \
                    -o jsonpath='{range .items[?(@.status.phase=="Released")]}{.metadata.name}{"\t"}{.spec.claimRef.namespace}{"\n"}{end}' 2>/dev/null || true)

                  if [ -n "$RELEASED_PVS" ]; then
                    echo "$RELEASED_PVS" | while IFS="$(printf '\t')" read -r PV_NAME PV_NS; do
                      [ -z "$PV_NAME" ] && continue
                      # Only clean PVs from paas workspace namespaces
                      case "$PV_NS" in
                        ${NS_PREFIX}*)
                          echo "DELETE Released PV: $PV_NAME (was bound to $PV_NS)"
                          # Patch reclaim policy to Delete so Longhorn volume is also reclaimed
                          kubectl patch pv "$PV_NAME" -p '{"spec":{"persistentVolumeReclaimPolicy":"Delete"}}' 2>/dev/null || true
                          kubectl delete pv "$PV_NAME" --wait=false && DELETED_PV=$((DELETED_PV + 1))
                          ;;
                        *)
                          ;;
                      esac
                    done
                  else
                    echo "No Released PVs found"
                  fi

                  echo "=== PVC Cleanup Complete: ${DELETED_PVC} PVCs, ${DELETED_PV} PVs deleted ==="
{{- end }}
