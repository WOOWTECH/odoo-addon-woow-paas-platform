[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -m "not integration"

markers =
    unit: Unit tests
    integration: Integration tests requiring a live K8s cluster — opt in with `pytest -m integration`
