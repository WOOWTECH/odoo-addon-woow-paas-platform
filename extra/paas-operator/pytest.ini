[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    -m "not integration"

# L4 reconciler TS-1（假綠守線）：
# - asyncio_mode=auto → 未標 @pytest.mark.asyncio 的 async test 仍被執行，
#   杜絕「未標 → 靜默 SKIPPED → assert 不跑」的 #208 假綠洞。
# - 移除 --disable-warnings + filterwarnings=error → coroutine-never-awaited /
#   async-skip 等假綠相關 warning 不再被吞、直接升 error 讓 CI 紅。
# - asyncio_default_fixture_loop_scope=function → 明示未來預設值，消 pytest-asyncio
#   deprecation warning（本套件零 async fixture，設此零行為影響、僅 forward-safe）。
# 守線測試見 tests/test_async_harness_guard.py。
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

filterwarnings =
    error

markers =
    unit: Unit tests
    integration: Integration tests requiring a live K8s cluster — opt in with `pytest -m integration`
