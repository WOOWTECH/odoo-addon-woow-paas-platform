[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    -m "not integration"

# L4 reconciler TS-1（假綠守線）：
# - asyncio_mode=auto → 未標 @pytest.mark.asyncio 的 async test 仍被執行，
#   杜絕「未標 → 靜默 SKIPPED → assert 不跑」的 #208 假綠洞。
# - 移除 --disable-warnings + filterwarnings=error → coroutine-never-awaited /
#   async-skip 等假綠相關 warning 不再被吞、直接升 error 讓 CI 紅。
# - asyncio_default_fixture_loop_scope=function → 明示未來預設值，消 pytest-asyncio
#   deprecation warning（本套件零 async fixture，設此零行為影響、僅 forward-safe）。
# 守線測試見 tests/test_async_harness_guard.py。
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

filterwarnings =
    error
    # anyio is an unpinned transitive dependency (fastapi/starlette, httpx). From
    # 4.15 the `anyio.abc.BlockingPortal` alias warns on access, and starlette's
    # TestClient touches it at import time — so on a runner whose hostedtoolcache
    # carries anyio 4.15.1, `error` above turns it into 22 collection errors
    # (intermittent red on develop and every PR, 2026-10-03). Only this one
    # message is ignored; every other warning still fails the run. Test-only on
    # purpose: pinning anyio in requirements.txt would also change the operator
    # image, which installs the same file.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning

markers =
    unit: Unit tests
    integration: Integration tests requiring a live K8s cluster — opt in with `pytest -m integration`
