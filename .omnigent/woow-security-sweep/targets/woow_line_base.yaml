# woow-security-sweep：WOOWTECH/woow_line_base 的內部上下文（⚠ 不可複製到 public repo）
#
# public 規則（scan／always_human／autofix／verify）在該 repo 預設分支的
# .security/sweep.yaml；collect.py 把兩份合併成 config.json。
# 這裡只放公開會洩漏攻擊面或未修漏洞的內容：context、review_focus、history、baseline、disclosure。

context:
  summary: LINE 基礎層。統一的 LINE Messaging API client（token、push、media 下載）、line.user 身分模型、partner 綁定 wizard。本模組沒有 HTTP
    controller，對外流量都經由下游模組進來。
  sensitive_code:
  - models/line_api_service.py
  - models/line_user.py
  - wizard/line_bind_partner_wizard.py
  trust_boundaries:
  - LINE API 回應 → Odoo（大小、型別、內容不可信）
  - 下游模組傳入的 LINE user id → line.user（可能是偽造的）
  downstream:
  - WOOWTECH/Woow_odoo_line_liff
  - WOOWTECH/woow_odoo_livechat_line
review_focus:
- sudo() 呼叫是否都有前置的權限或身分檢查
- token、secret 是否可能被寫進 log、exception 訊息或 chatter
- 對外 HTTP 呼叫是否都有 timeout 與大小上限
history:
  fixed:
  - H-7
  - H-8
  - H-12
disclosure:
  findings_to: omnigent_inbox
  fix_via: github_security_advisory
baseline: []

# baseline 格式（accepted 必須有 expires，不允許永久豁免）：
#  - id: <自訂或 H-xx>
#    fingerprint: <collect.py 產出的 fingerprint>
#    status: accepted | tracked
#    reason: ...
#    approved_by: <人>
#    expires: YYYY-MM-DD
