# ⚠ 由 .omnigent/build-bundles.py 產生——⛔ 不要手改。
#   改 build-bundles.py 再重跑：python3 .omnigent/build-bundles.py

spec_version: 1
name: repo_leader_pi
description: repo 層 leader（pi）：把 issue 工單拆成 worker 任務、在執行期產生 worker config 並派工、收斂驗收；自己不寫產品程式碼。

executor:
  type: omnigent
  reasoning_effort: xhigh
  model: gpt-6-astra
  config:
    harness: pi

# spawn: true 是這個架構的關鍵——worker 不再是靜態 sub-agent，而是由本層在執行期
# 用 generate-worker.py 寫出 config 後以 sys_session_create(config_path=…) 起來。
# ⚠ 實測：動態 config 的 harness / model / guardrails.policies / spawn 全部生效，
#   且**不需要**在 tools.agents 列名（那套靜態 allowlist 已廢）。
spawn: true

# prompt 由同目錄的 AGENTS.md 承載（實體檔，來源：_shared/repo_leader/AGENTS.md）。
# ⛔ 不要手改產物——改來源再跑 build-bundles.py（drift 由 --check 第 0 項對帳）。
# ⛔ 不要改寫成 `instructions: <相對路徑>`：containment 檢查失敗時會回 None，
#    接著整條路徑字串被當成 system prompt，而且不報錯。

# ⛔ 一律固定 `all`，絕不可設 `none`——`none` 會發出 --setting-sources ""，
#    壓掉 dispatcher 與所有 repo hooks（inner/bundle_skills.py）。
skills: all

os_env:
  # ⚠ cwd 寫 `.` 是刻意的：runner 一律用 OMNIGENT_RUNNER_WORKSPACE 覆寫它（見
  #   build-bundles.py 的 OS_ENV_BLOCK 註解），所以這裡寫什麼都不會生效；而寫絕對路徑
  #   會讓 deployed server 直接拒收整個 bundle（GHSA-p8rw-8qj3-hf33）。
  #   ⛔ 不要改成絕對路徑——實際的 containment 錨點是啟動 omnigent run 時的 shell cwd。
  type: caller_process
  cwd: .
  sandbox:
    type: none

guardrails:
  ask_timeout: 900
  policies:
    spawn_bounds:
      type: function
      function:
        path: omnigent.policies.builtins.orchestration.spawn_bounds
        arguments:
          max_dispatches_per_turn: 6
          dispatch_tools: [sys_session_send, sys_session_create]
    headless_subagent_purpose_guard:
      type: function
      function:
        path: omnigent.policies.builtins.orchestration.headless_subagent_purpose_guard
        arguments:
          allowed_purposes: [implement, review, explore, search, deploy, triage, researcher]
    p_board_read_only:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: |-
            event.type == "tool_call" && (
              (event.data.name in ["sys_os_write", "sys_os_edit", "Write", "Edit", "MultiEdit", "write", "edit"] && (
                (has(event.data.arguments.path) && event.data.arguments.path.matches("\\.woow-issues/"))
                || (has(event.data.arguments.file_path) && event.data.arguments.file_path.matches("\\.woow-issues/"))
              ))
              || (event.data.name in ["Bash", "Shell", "bash", "developer__shell", "shell", "sys_os_shell", "terminal"]
                  && has(event.data.arguments.command)
                  && event.data.arguments.command.matches("\\.woow-issues/")
                  && !(event.data.arguments.command.matches("^\\s*(cat|less|head|tail|grep|rg|ls|wc|diff|git\\s+diff|git\\s+show)\\b")
                       && !event.data.arguments.command.matches("(&&|\\|\\||;|\\||`|\\$\\(|\\n)")))
            ) ? {"result": "DENY", "reason": "看板 .woow-issues/ 只有 woow-issue-leader 能寫。唯讀請用單一不串接的 cat / less / head / tail / grep / rg / ls / wc / diff / git diff / git show；要更新內容就寫進回報，由上層代寫。"} : {"result": "ALLOW"}
    p_merge_no_agent_merge:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: |-
            event.type == "tool_call"
            && event.data.name in ["Bash", "Shell", "bash", "developer__shell", "shell", "sys_os_shell", "terminal"]
            && has(event.data.arguments.command)
            && event.data.arguments.command.matches("(\\b(tea|gh|glab)\\s+(pulls?|pr|mr)\\s+merge\\b|\\b(gh|glab)\\s+api\\b[\\s\\S]*/merge\\b|\\bcurl\\b[\\s\\S]*/merge\\b|\\b(gh|glab|curl)\\b[\\s\\S]*\\bgraphql\\b[\\s\\S]*[Mm]erge)")
            ? {"result": "DENY", "reason": "merge 是人工 gate，agent 不代 merge（含 gh api / tea pulls merge 等變形）。開好 PR 等人來 merge。"} : {"result": "ALLOW"}
    p_approve_no_agent_signoff:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: |-
            event.type == "tool_call"
            && event.data.name in ["Bash", "Shell", "bash", "developer__shell", "shell", "sys_os_shell", "terminal"]
            && has(event.data.arguments.command)
            && event.data.arguments.command.matches("/approve")
            ? {"result": "DENY", "reason": "prod build 的 /approve 核可只能由授權者本人送出——即使人類當場明確授權、即使手上憑證就是授權者本人，agent 也不代簽。"} : {"result": "ALLOW"}
    p_tag_no_agent_tag_push:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: |-
            event.type == "tool_call"
            && event.data.name in ["Bash", "Shell", "bash", "developer__shell", "shell", "sys_os_shell", "terminal"]
            && has(event.data.arguments.command)
            && (
                 (event.data.arguments.command.matches("\\bgit\\b[\\s\\S]*\\bpush\\b")
                  && event.data.arguments.command.matches("(--tags|--follow-tags|refs/tags/|[\\s:][\"\']?([A-Za-z0-9._-]+-)?v[0-9])"))
              || event.data.arguments.command.matches("refs/tags/")
              || event.data.arguments.command.matches("\\b(tea\\s+(releases|release|r)|gh\\s+release|glab\\s+release)\\b")
              || ((event.data.arguments.command.matches("\\b(tea|gh|glab)\\s+api\\b")
                   || event.data.arguments.command.matches("\\bcurl\\b"))
                  && event.data.arguments.command.matches("/releases/?(\\?[^\\s\"\');&|><]*)?[\"\']?([\\s);&|><]|$)")
                  && (event.data.arguments.command.matches("(^|\\s)(-X(=|\\s*)(POST|post)|--(method|request)(=|\\s+)(POST|post))(\\s|$)")
                      || (event.data.arguments.command.matches("\\b(tea|gh|glab)\\s+api\\b")
                          && event.data.arguments.command.matches("(^|\\s)((-f|-F|-d)([^\\s-]|\\s+)|--(field|Field|raw-field|form|input|data)(=|\\s+))")
                          && !event.data.arguments.command.matches("(^|\\s)(-X(=|\\s*)[A-Za-z]+|--(method|request)(=|\\s+)[A-Za-z]+)(\\s|$)"))
                      || (event.data.arguments.command.matches("\\bcurl\\b")
                          && event.data.arguments.command.matches("(^|\\s)((-d|-F)([^\\s-]|\\s+)|--(data|data-ascii|data-binary|data-raw|data-urlencode|form|json)(=|\\s+))")
                          && !event.data.arguments.command.matches("(^|\\s)(-X(=|\\s*)[A-Za-z]+|--(method|request)(=|\\s+)[A-Za-z]+)(\\s|$)")
                          && !event.data.arguments.command.matches("(^|\\s)(-G|--get)(\\s|$)"))))
              || event.data.arguments.command.matches("\\bgh\\b[\\s\\S]*\\bapi\\b[\\s\\S]*git/refs")
              || event.data.arguments.command.matches("-X\\s+(POST|PATCH|PUT)[\\s\\S]*git/refs")
              || event.data.arguments.command.matches("\\bgit\\s+tag\\s+[^-\\s]")
            )
            ? {"result": "DENY", "reason": "發版 tag 由人工推，agent 不推 tag、不建 release（v<版號> / --tags / refs/tags/ / git tag <name> / forge release 子命令 / POST /releases collection 建立端點〔可帶尾斜線〕皆擋）。⚠ 刻意誤擋：branch 名以 <字>-v<數字> 開頭（如 1032-v18-upgrade）或 HEAD:v… 也會命中——branch 名改用 <type>/<issue-id>-… 形式；只是要讀 tag 用 git fetch --tags / git ls-remote --tags / git tag -l。"} : {"result": "ALLOW"}
    p_escape_obfuscated_command:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: |-
            event.type == "tool_call"
            && event.data.name in ["Bash", "Shell", "bash", "developer__shell", "shell", "sys_os_shell", "terminal"]
            && has(event.data.arguments.command)
            && event.data.arguments.command.matches("\\\\[a-zA-Z0-9]")
            && event.data.arguments.command.matches("(k\\\\?u\\\\?b\\\\?e|m\\\\?e\\\\?r\\\\?g\\\\?e|a\\\\?p\\\\?p\\\\?r\\\\?o\\\\?v\\\\?e|t\\\\?a\\\\?g|p\\\\?u\\\\?s\\\\?h|b\\\\?o\\\\?a\\\\?r\\\\?d|w\\\\?o\\\\?o\\\\?w\\\\?-\\\\?i\\\\?s\\\\?s\\\\?u\\\\?e\\\\?s)")
            ? {"result": "DENY", "reason": "指令同時含反斜線轉義序列與敏感字根（kube／merge／approve／tag／push／board）——這種寫法無法用字串比對判斷真正要執行什麼。請改用不含轉義的直白寫法。"} : {"result": "ALLOW"}
    max_tool_calls_per_session:
      type: function
      function:
        path: omnigent.policies.builtins.safety.max_tool_calls_per_session
        arguments:
          limit: 400
    detect_loop:
      type: function
      function:
        path: omnigent.policies.builtins.safety.detect_loop
        arguments:
          window: 10
          threshold: 3
    detect_thrashing:
      type: function
      function:
        path: omnigent.policies.builtins.context.detect_thrashing
        arguments:
          consecutive_threshold: 5
          window: 10
          action: ASK
