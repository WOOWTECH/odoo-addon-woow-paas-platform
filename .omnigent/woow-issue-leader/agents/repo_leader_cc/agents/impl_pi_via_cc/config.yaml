# ⚠ 由 .omnigent/build-bundles.py 產生——⛔ 不要手改。
#   改 build-bundles.py 再重跑：python3 .omnigent/build-bundles.py

spec_version: 1
name: impl_pi_via_cc
description: 實作 worker（pi）：同 implementer_cc，換 pi 額度池、跨 vendor 的另一個方向。

executor:
  type: omnigent
  config:
    harness: pi

# prompt 由 AGENTS.md symlink 承載（→ _workers/implementer_pi/AGENTS.md）。
# ⛔ 不要改寫成 `instructions: <相對路徑>`：containment 檢查會讓外指 symlink 回
#    None，接著整條路徑字串被當成 system prompt，而且不報錯。

# ⛔ 一律固定 `all`。名單模式在 claude-native 下形同 all、不強制；在 pi 下卻會下
#    --no-skills 把 host skill 一併關掉——跨 harness 行為相反。
skills: all

os_env:
  # ⚠ cwd 不決定 harness 的 process cwd（實測）——它是 server 模式的**邊界**與
  #   sys_os_* / config_path containment 的錨點。設在六個 repo 的共同父目錄，讓跨 repo
  #   唯讀查詢落在邊界內。這是全樹唯一一個機器相關的絕對路徑。
  type: caller_process
  cwd: /home/elmo/woow-repos
  sandbox:
    type: none

guardrails:
  # ⚠ child 不繼承 parent 的 guardrails.policies（實測）⇒ 每個 worker 自帶完整
  #   policy，不能靠 leader 罩下來。
  ask_timeout: 86400
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.orchestration.blast_radius
        arguments:
          gate_pushes: true
    # allowed_root 只用在 deny 訊息；真正的規則是「絕對路徑或含 .. 的寫入路徑一律
    # DENY」。它要成立，前提是 cwd 不會被搬走 → 見下面的 block_working_dir_changes。
    worktree_guard:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.orchestration.worktree_guard
        arguments:
          allowed_root: '<工單指定的 worktree>'
    # 未給 allowed_dirs ⇒ 所有 cd / pushd / popd / git -C / git worktree 一律 DENY。
    # 這是 worktree_guard 的另一半：擋掉「先 cd 出去、再寫相對路徑」的逃逸。
    # 副作用（刻意）：implementer 不能跨 repo，跨 repo 唯讀是 leader 的職責。
    block_working_dir_changes:
      type: function
      function:
        path: omnigent.policies.builtins.working_dir.block_working_dir_changes
        arguments:
          block_cd: true
          block_worktree: true
          action: deny
    p_board_read_only:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: |-
            event.type == "tool_call" && (
              (event.data.name in ["sys_os_write", "sys_os_edit", "Write", "Edit", "MultiEdit", "write", "edit"] && (
                (has(event.data.arguments.path) && event.data.arguments.path.matches("\\.woow-issues/"))
                || (has(event.data.arguments.file_path) && event.data.arguments.file_path.matches("\\.woow-issues/"))
              ))
              || (event.data.name in ["Bash", "Shell", "bash", "developer__shell", "shell", "sys_os_shell", "terminal"]
                  && has(event.data.arguments.command)
                  && event.data.arguments.command.matches("\\.woow-issues/")
                  && !(event.data.arguments.command.matches("^\\s*(cat|less|head|tail|grep|rg|ls|wc|diff|git\\s+diff|git\\s+show)\\b")
                       && !event.data.arguments.command.matches("(&&|\\|\\||;|\\||`|\\$\\(|\\n)")))
            ) ? {"result": "DENY", "reason": "看板 .woow-issues/ 只有 woow-issue-leader 能寫。唯讀請用單一不串接的 cat / less / head / tail / grep / rg / ls / wc / diff / git diff / git show；要更新內容就寫進回報，由上層代寫。"} : {"result": "ALLOW"}
    p_merge_no_agent_merge:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: |-
            event.type == "tool_call"
            && event.data.name in ["Bash", "Shell", "bash", "developer__shell", "shell", "sys_os_shell", "terminal"]
            && has(event.data.arguments.command)
            && event.data.arguments.command.matches("(\\b(tea|gh|glab)\\b[\\s\\S]*\\bmerge\\b|\\bcurl\\b[\\s\\S]*merge|\\b(tea|gh|glab)\\s+(pulls?|pr|mr)\\s+m[a-z]*\\b)")
            ? {"result": "DENY", "reason": "merge 是人工 gate，agent 不代 merge（含 gh api / tea pulls merge 等變形）。開好 PR 等人來 merge。"} : {"result": "ALLOW"}
    p_approve_no_agent_signoff:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: |-
            event.type == "tool_call"
            && event.data.name in ["Bash", "Shell", "bash", "developer__shell", "shell", "sys_os_shell", "terminal"]
            && has(event.data.arguments.command)
            && event.data.arguments.command.matches("/approve")
            ? {"result": "DENY", "reason": "prod build 的 /approve 核可只能由授權者本人送出——即使人類當場明確授權、即使手上憑證就是授權者本人，agent 也不代簽。"} : {"result": "ALLOW"}
    p_tag_no_agent_tag_push:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: |-
            event.type == "tool_call"
            && event.data.name in ["Bash", "Shell", "bash", "developer__shell", "shell", "sys_os_shell", "terminal"]
            && has(event.data.arguments.command)
            && (
                 (event.data.arguments.command.matches("\\bgit\\b[\\s\\S]*\\bpush\\b")
                  && event.data.arguments.command.matches("(--tags|--follow-tags|refs/tags/|[\\s:]([A-Za-z0-9._-]+-)?v[0-9])"))
              || event.data.arguments.command.matches("refs/tags/")
              || event.data.arguments.command.matches("\\b(tea|gh|glab)\\b[\\s\\S]*\\brelease")
              || event.data.arguments.command.matches("\\bgh\\b[\\s\\S]*\\bapi\\b[\\s\\S]*git/refs")
              || event.data.arguments.command.matches("-X\\s+(POST|PATCH|PUT)[\\s\\S]*git/refs")
              || event.data.arguments.command.matches("\\bgit\\s+tag\\s+[^-\\s]")
            )
            ? {"result": "DENY", "reason": "發版 tag 由人工推，agent 不推 tag、不建 release（v<版號> / --tags / refs/tags/ / git tag <name> / forge release 皆擋）。"} : {"result": "ALLOW"}
    p_escape_obfuscated_command:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: |-
            event.type == "tool_call"
            && event.data.name in ["Bash", "Shell", "bash", "developer__shell", "shell", "sys_os_shell", "terminal"]
            && has(event.data.arguments.command)
            && event.data.arguments.command.matches("\\\\[a-zA-Z0-9]")
            && event.data.arguments.command.matches("(k\\\\?u\\\\?b\\\\?e|m\\\\?e\\\\?r\\\\?g\\\\?e|a\\\\?p\\\\?p\\\\?r\\\\?o\\\\?v\\\\?e|t\\\\?a\\\\?g|p\\\\?u\\\\?s\\\\?h|b\\\\?o\\\\?a\\\\?r\\\\?d|w\\\\?o\\\\?o\\\\?w\\\\?-\\\\?i\\\\?s\\\\?s\\\\?u\\\\?e\\\\?s)")
            ? {"result": "DENY", "reason": "指令同時含反斜線轉義序列與敏感字根（kube／merge／approve／tag／push／board）——這種寫法無法用字串比對判斷真正要執行什麼。請改用不含轉義的直白寫法。"} : {"result": "ALLOW"}
    max_tool_calls_per_session:
      type: function
      function:
        path: omnigent.policies.builtins.safety.max_tool_calls_per_session
        arguments:
          limit: 400
    detect_loop:
      type: function
      function:
        path: omnigent.policies.builtins.safety.detect_loop
        arguments:
          window: 10
          threshold: 3
    detect_thrashing:
      type: function
      function:
        path: omnigent.policies.builtins.context.detect_thrashing
        arguments:
          consecutive_threshold: 5
          window: 10
          action: ASK
