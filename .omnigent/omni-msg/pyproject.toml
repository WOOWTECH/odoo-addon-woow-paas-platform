[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "woow-omni-msg"
version = "0.3.0"
description = "具備 session ACL 與 durable receipts 的 Omnigent messaging bridge"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
omni-msg = "omni_msg.cli:main"

[tool.setuptools.packages.find]
include = ["omni_msg*"]
