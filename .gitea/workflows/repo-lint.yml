name: repo-lint
on:
  pull_request:
    # 🔴 這份白名單的維護義務：**新 check 讀哪些檔，這裡就要有哪些檔**。
    # 少一條不會有任何訊號——job 不是紅也不是綠，它根本不出現。
    #
    # #461：extra/paas-operator/** 持有 reset 預算階梯的**內層**常數
    # （RESET_HARD_CAP_SECONDS 等）。沒有這一行，「只改 operator 常數」的 PR
    # 不會觸發 repo-lint ⇒ check_reset_budget_ladder 對它完全休眠（#463 同型的
    # CI paths 盲點：gate 寫好了卻不會被跑到）。
    #
    # #547：pattern-doc-registry 的輸入是「pattern doc 目錄 ／ pattern-guard-map
    # ／ 索引 README ／ map 指到的每一個檔」。這四者原本**整批落在白名單外**
    # ⇒ 只改 doc、或只改 map 的 PR 不觸發 repo-lint，新 check 對「doc 被改壞」
    # 這一半完全休眠（S1 沒有 S2 等於沒做）。
    #   - docs/decisions/patterns/**：pattern doc 本體與索引 README
    #   - docs/tracking/pitfalls/**：map 有 6 個條目指到這裡
    #   - .claude/hooks/**        ：pattern-guard-map.json 與 hook 本體
    #   - CLAUDE.md               ：map 的 seed-default-template class 指到它
    #
    # ⚠ 適用範圍：以上「維護白名單」的義務只適用於**非 required status check** 的 job。
    # 一旦某個 check 進了 required 清單，paths 白名單的性質就從「省時間」翻轉成「卡死」——
    # 沒命中時該 context **不存在**（不是紅也不是綠），而 required 的判準是「context
    # 存在且成功」⇒ 被過濾掉的 PR 永遠湊不齊 check、永遠不能 merge。
    #
    # 🔴 判準（刻意只寫規則、不寫當下狀態——狀態會過期，規則不會）：
    #   **任何 workflow 要進 required 清單之前，必須先確認它沒有 paths／branches 過濾；
    #     有就得先拿掉。** 對 repo-lint 而言＝要設成 required 就必須先刪掉下面這份 paths，
    #     否則只動 docs/guides/**、.gitea/**、scripts/ci/** … 的 PR 會立刻永遠卡死。
    #   已按此判準改成無條件執行的範例：.gitea/workflows/manifest-version-gate.yml（#538）。
    #
    # repo-lint 現在是不是 required，**看 develop 分支保護的 status_check_contexts**
    # ——那是權威來源，刻意不在此複述。（本行原本複述過一個布林值，設定一改就成了活的假話；
    # 那正是本檔上下文所要防的形態，見 #538 的三張後續工單。）
    paths:
      - "src/**"
      - "scripts/audit/**"
      - "extra/paas-operator/**"
      - "docs/decisions/patterns/**"
      - "docs/tracking/pitfalls/**"
      - ".claude/hooks/**"
      - "CLAUDE.md"
jobs:
  repo-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/audit/repo-lint.py --all
