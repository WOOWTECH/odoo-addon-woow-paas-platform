# PaaS Operator unit suite（Refs issue #856）
#
# 實測 655 passed / 45 deselected，約 25 秒；因此 PR 與 develop push 都執行，
# 讓 operator regression 在合併前現形。integration 測試需要真 K8s，仍依
# CLAUDE.md 的本機 integration recipe 執行，不納入這個普通 CI job。
#
# 🔴 這支要進 required 清單之前，**必須先刪掉下面兩份 paths-ignore**（#933）。
#   判準與理由的權威出處是 .gitea/workflows/repo-lint.yml 的同一段（#538）：
#   被過濾掉時該 context **不存在**——不是紅也不是綠——而 required 的判準是
#   「context 存在且成功」⇒ 只動 docs/**、**.md、.claude/** 的 PR 會永遠湊不齊
#   check、永遠不能 merge，而且症狀與「CI 還在跑」無法區分，重跑也救不回來
#   （沒觸發就是沒觸發）。已按此判準改成無條件執行的先例：manifest-version-gate.yml。
#
#   ⚠ 這支現在是不是 required，**看 develop 分支保護的 status_check_contexts**
#     ——那是權威來源，刻意不在此複述一個會過期的布林值。
name: paas-operator-unit-tests

on:
  pull_request:
    # 採 paths-ignore：漏列最多多跑一次，不會讓 operator 改動靜默失去測試。
    # ⛔ 這句只在「非 required」的前提下成立——升 required 前的動作見檔頭 🔴。
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".claude/**"
  push:
    branches:
      - develop
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".claude/**"
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # ⛔ 刻意**不用** `cache: pip`。拿掉的是一個「零效益、有破壞力」的機制：
      #
      # 效益為零：runner image（`docker.gitea.com/runner-images:ubuntu-latest`）的
      # hostedtoolcache 已經預裝了 requirements.txt 指定的全部版本 ⇒ 每一趟
      # `pip install -r requirements.txt` 對每一行都印 `Requirement already satisfied`，
      # 從頭到尾沒有下載、沒有建置、沒有寫入 ⇒ `pip cache dir` 指的
      # `/root/.cache/pip` **從來不會被建立**，也就沒有東西可快取。
      #
      # 破壞力：`setup-python@v5` 的 **post 階段**（cache-save）用 `fs.existsSync`
      # 檢查那個路徑，不存在就 `throw` ⇒ 四個真正的步驟全部 success，job 卻被判
      # failure。實測 run 6776～6809 連續 9 趟都是這個形態，錯誤原文：
      #   `::error::Cache folder path is retrieved for pip but doesn't exist on
      #    disk: /root/.cache/pip. This likely indicates that there are no
      #    dependencies to cache.`
      # 這是上游公認的 bug（actions/setup-python #815／#932／#1169），已在
      # **v6.0.0** 由 PR #1182 把 hard error 降級為 warning；但 `v5` 這條線在
      # v5.6.0 之後凍結，我們釘的 `@v5` 解析到的 commit **沒有**那個修法。
      #
      # ⚠ 另一個候選修法是「setup-python 之前先 `mkdir -p ~/.cache/pip`」。
      #   不選它的理由：那是替一個不產生任何快取內容的機制**造一個空目錄去騙過
      #   存在性檢查**——症狀消失、零效益的機制留著，下一個人還要再讀一次這段。
      #   ⇒ 真的哪天 runner image 不再預裝、pip 真的會下載時，再把 cache 加回來
      #     （屆時目錄自然存在，本 bug 也不會觸發）。
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: extra/paas-operator
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      # 重複明示 marker（pytest.ini 也有同一條）是刻意的：即使預設 addopts
      # 日後被改動，普通 CI 仍不會誤跑需要真叢集的 integration tests。
      - name: Run unit tests (exclude live K8s integration tests)
        working-directory: extra/paas-operator
        run: python -m pytest tests/ -m "not integration"
