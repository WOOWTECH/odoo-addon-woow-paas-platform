name: security-sweep-tests

on:
  pull_request:
    paths:
      - ".omnigent/woow-security-sweep/**"
      - ".omnigent/woow-issue-leader/generate-worker.py"
      - ".gitea/workflows/security-sweep-tests.yml"
  push:
    branches:
      - develop
    paths:
      - ".omnigent/woow-security-sweep/**"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install pyyaml
      - name: collect.py / jev_gate.py unit tests（不打網路、不跑掃描工具）
        run: python -m unittest discover -s .omnigent/woow-security-sweep/tests -v
