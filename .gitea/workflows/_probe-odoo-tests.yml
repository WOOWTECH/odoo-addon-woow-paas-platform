# ⚠ 拋棄式量測探針（T3 Phase 1）——不是交付物，量完即刪。
#
# ══════ 量測結果（寫在這裡當耐久載體：scratchpad 有 TTL，git 沒有）══════
#
# run 1422（develop 3b840b29，唯一一次完整跑完）：
#   image pull 0s（warm，2.48 GB）／容器起 3s／docker cp 覆蓋 addon 3s
#   install 77s ／ 全套測試 298s ／ 整個 CI job ≈ 6 分鐘
#   結果：0 failed, 0 error(s) of 2237 tests   ← develop 是乾淨綠燈基準
#   （同次另印 odoo.tests.stats: 3067 tests 259.47s ——口徑不同，別跟 2237 混用）
#
# runner 環境：act-runner-runner-0 v2.0.1（capacity 1）／256 核 128 GB／native amd64
#   job container = docker.gitea.com/runner-images:ubuntu-latest，entrypoint sleep 10800（job 上限 3h）
#   step shell = bash --noprofile --norc -e -o pipefail（`| head` 會 SIGPIPE=141 中止 step）
#   docker 28.5.2 走掛載的 /run/docker.sock ⇒ daemon 在 job container 外，`-v` 掛不到 workspace
#   docker 資料所在 fs 剩 24 G；預設 bridge 可連 pypi（自訂 network MTU 1500 會壞）
#
# 私有 addon：sh_subscription / ecpay_invoice_tw / ai_base_gt 三個都在 paas-odoo image 內（ADDON_PRESENT）
#   全部 8 個私有 addon checked in 在 woow-paas/paas-odoo-ci 的 addons/，CI 不需 clone 第二個 repo
#   secrets.JCR_USERNAME/JCR_PASSWORD 在本 repo 可用（run 1349 實證）
#
# MemoryError 真因（run 1421 死在 base 的 _reflect_fields，run 1424 A/B 隔離）：
#   odoo/service/server.py:556 ThreadedServer.start() 無條件呼叫 set_limit_memory_hard()，
#   把 RLIMIT_AS 壓到 limit_memory_hard 預設 2.5 GB（config.py:349）；256 核的 glibc arena 撐爆它。
#   ⇒ 唯一必要旗標是 --limit-memory-hard=0
#     （--workers=0 本來就是預設＝no-op；--limit-memory-soft 只有 PreforkServer 讀＝no-op；
#      MALLOC_ARENA_MAX 實測「有設但不帶旗標」仍 MemoryError ⇒ 不是解，別留在 recipe 裡）
#
# run 1432（重跑，數字可重現）：install 73s／測試 296s／同樣 0F/0E of 2237
#   skipped_count=0；DETAIL_REPORT_PRESENT=yes（--log-handler=odoo.tests.stats:DEBUG 確實產出）
#   detail 行數 module=1 / class=415 / method=3067（3067 ≠ 2237，口徑不同勿混用）
#
# run 1433（skip 偵測的陽性對照）：注入必然 skip 的哨兵
#   哨兵 summary = 0 failed, 0 error(s) of 2 tests ← 其中一條什麼都沒驗，summary 一字未提
#   sentinel_skipped_count=1（用與全套完全相同的 shell grep）⇒ 偵測器有效
#   ⇒ 全套的 skipped_count=0 是真的 0，基準成立
#   真實 skip 行原文（含「理由帶冒號」「行尾空白」兩個坑）：
#     ... INFO test odoo.addons.woow_paas_platform.tests.test_probe_sentinel: \
#         skipped TestProbeSentinel.test_probe_sentinel_skips : probe sentinel: deliberately skipped
#
# 📌 已排程取得（非未解）：靜態 424 個「直接定義 def test_* 的 class」vs CI detail report 的 415，差 9。
#   已歸因 4（#467 的 3 個 + @tagged('-standard') 的 TestEcpayInvoiceReal），剩 5 個不明。
#   刻意不給推測解釋。取得方式＝搭 B+C 落地後第一趟 develop push 全套的便車一併匯出 415 行清單，
#   不為此另外佔用單一 act-runner（2026-08-03 leader 裁決）。
# ═══════════════════════════════════════════════════════════════════
#
# 目的：取得「全套 Odoo 測試在 Gitea act-runner 上跑一次要多久」的實測數字，
# 以及 runner 環境的實際能力（docker / 磁碟 / CPU / JCR image 可拉否 / 外網可達否）。
# 這些數字是觸發策略決策的輸入，工單明訂「不准推估」。
#
# 只在 ci/run-odoo-tests 分支上跑，不掛任何 pull_request 觸發，
# 因此不會影響其他人的 PR CI（但仍會佔用唯一的 runner slot）。
#
# 刻意用「預設 bridge network」而非自訂 network：
# reference_act_runner_dind_mtu_custom_network —— dind 的 daemon.json mtu=1400
# 只作用在預設 docker0，自訂 network 一律 1500 > pod eth0 1450，外網 TLS 會被丟。
# 代價是預設 bridge 沒有 embedded DNS，所以用 IP 連 postgres。
name: PROBE - measure full Odoo test suite

on:
  # ⚠ 刻意只留 workflow_dispatch：原本掛 `push: ci/run-odoo-tests`，
  # 結果連「只改註解」的 commit 都會重新觸發，白佔唯一的 runner slot 幾分鐘
  # （2026-08-03 run 1428 就是這樣被我自己誤觸的）。要再量就手動 dispatch。
  workflow_dispatch:
    inputs:
      run_full:
        description: "跑全套（5 分鐘）；false 時只跑哨兵驗證（約 1 分鐘）"
        required: false
        default: "false" 

env:
  JCR: artifactory-jcr-artifactory-nginx.jfrog.svc.cluster.local
  ODOO_BIN: /opt/bitnami/odoo/bin/odoo
  ADDONS_PATH: /opt/bitnami/odoo/lib/odoo/addons,/opt/bitnami/odoo/custom-addons
  MODULE_DIR: /opt/bitnami/odoo/custom-addons/woow_paas_platform
  # reference_odoo_test_docker_desktop_paas_image：沒注入這個變數，
  # TestNamespaceLeftSetUnion 會 fail-closed raise，基準會多 2E。
  AGENT_RUNTIME_NAMESPACE_SECRET: probe-secret

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: R1 - runner 環境事實
        run: |
          echo "### R1 runner facts"
          uname -a
          echo "nproc=$(nproc)"
          free -m || true
          df -h
          docker version
          echo "--- docker info ---"
          # ⚠ 這裡不能接 `| head`：runner 的 shell 是 bash -e -o pipefail，
          # head 提早關 pipe 會讓上游收 SIGPIPE → 退出碼 141 → pipefail+(-e) 直接中止 step。
          docker info 2>&1 | grep -E "Docker Root Dir|Storage Driver|Server Version|Total Memory|CPUs" || true
          echo "--- 既有 image（判斷 daemon 儲存是否跨 job 保留）---"
          docker images
          echo "--- docker 資料所在檔案系統餘量 ---"
          docker system df || true

      - name: R2 - JCR login
        run: |
          echo "${{ secrets.JCR_PASSWORD }}" | \
            docker login "${JCR}" -u "${{ secrets.JCR_USERNAME }}" --password-stdin

      - name: R3 - pull paas-odoo image（計時）
        run: |
          T0=$(date +%s)
          IMG=""
          for CAND in \
            "${JCR}/woow-paas-docker-local/paas-odoo:latest" \
            "${JCR}/woow-paas-docker-local/paas-odoo-stg:latest"; do
            echo "--- try pull $CAND ---"
            if docker pull "$CAND"; then IMG="$CAND"; break; fi
          done
          if [ -z "$IMG" ]; then echo "::error::兩個候選 image 都拉不到"; exit 1; fi
          T1=$(date +%s)
          echo "MEASURE pull_seconds=$((T1-T0)) image=$IMG"
          echo "IMG=$IMG" >> "$GITHUB_ENV"
          docker image inspect "$IMG" --format 'image_size_bytes={{.Size}}'
          df -h /

      - name: R4 - 起 postgres + odoo 容器（預設 bridge，計時）
        run: |
          T0=$(date +%s)
          docker run -d --name pg \
            -e POSTGRES_USER=odoo -e POSTGRES_PASSWORD=odoo -e POSTGRES_DB=postgres \
            postgres:15
          # 不設 MALLOC_ARENA_MAX：run 1424 的 A/B 已證明它不是 MemoryError 的解，
          # 真正載重的是 odoo 的 --limit-memory-hard=0（見檔頭）。
          docker run -d --name odoo \
            -e AGENT_RUNTIME_NAMESPACE_SECRET="${AGENT_RUNTIME_NAMESPACE_SECRET}" \
            --entrypoint bash "$IMG" -c 'sleep infinity'
          for i in $(seq 1 60); do
            if docker exec pg pg_isready -U odoo >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec pg pg_isready -U odoo
          PG_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' pg)
          if [ -z "$PG_IP" ]; then echo "::error::拿不到 pg IP"; exit 1; fi
          echo "PG_IP=$PG_IP" >> "$GITHUB_ENV"
          echo "PG_IP=$PG_IP"
          T1=$(date +%s)
          echo "MEASURE containers_up_seconds=$((T1-T0))"

      - name: R5 - 覆蓋 addon + 驗私有 addon + 外網可達性
        run: |
          T0=$(date +%s)
          # 整棵換掉，避免 stale 檔（reference_odoo_test_amd64_woowk3s_cp_overlay 的教訓）
          docker exec odoo rm -rf "${MODULE_DIR}"
          docker exec odoo mkdir -p "${MODULE_DIR}"
          docker cp src/. "odoo:${MODULE_DIR}/"
          docker exec odoo sh -c "find ${MODULE_DIR} -name __pycache__ -type d -exec rm -rf {} + || true"
          echo "--- 覆蓋驗證：容器內 manifest 版號應等於本 checkout ---"
          docker exec odoo sh -c "grep -m1 version ${MODULE_DIR}/__manifest__.py"
          grep -m1 version src/__manifest__.py
          echo "--- 工單指定要驗的三個私有 addon ---"
          for A in sh_subscription ecpay_invoice_tw ai_base_gt; do
            docker exec odoo sh -c "test -f /opt/bitnami/odoo/custom-addons/$A/__manifest__.py \
              && echo \"ADDON_PRESENT $A\" || echo \"ADDON_MISSING $A\""
          done
          echo "--- image 內 custom-addons 全清單 ---"
          docker exec odoo ls /opt/bitnami/odoo/custom-addons/
          echo "--- 容器（預設 bridge）能不能連外網（決定 pip install 可行性）---"
          docker exec odoo sh -c \
            "curl -sS -m 25 -o /dev/null -w 'pypi_http=%{http_code}\n' https://pypi.org/simple/" \
            || echo "pypi_http=FAILED"
          echo "--- 本 checkout 的 python 依賴是否已在 image venv 內 ---"
          docker exec odoo /opt/bitnami/odoo/venv/bin/python -c \
            "import websockets, jwt, yaml; print('DEPS_OK', websockets.__version__)" \
            || echo "DEPS_MISSING"
          T1=$(date +%s)
          echo "MEASURE overlay_seconds=$((T1-T0))"

      - name: R5b - MemoryError 診斷（run 1421 在 base 的 _reflect_fields 噴 MemoryError）
        run: |
          echo "--- ulimit ---"
          docker exec odoo sh -c 'ulimit -a' || true
          echo "--- python RLIMIT_AS ---"
          docker exec odoo /opt/bitnami/odoo/venv/bin/python -c \
            "import resource,os; print('RLIMIT_AS', resource.getrlimit(resource.RLIMIT_AS)); print('cpu', os.cpu_count())" || true
          echo "--- cgroup memory ---"
          docker exec odoo sh -c 'cat /sys/fs/cgroup/memory.max 2>/dev/null || cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null' || true
          echo "--- ODOO_* env（image baked）---"
          docker exec odoo sh -c 'env | grep -i odoo' || true
          echo "--- 可能被自動讀到的 conf ---"
          for C in /opt/bitnami/odoo/conf/odoo.conf /etc/odoo/odoo.conf /opt/bitnami/odoo/odoo.conf; do
            echo "### $C"
            docker exec odoo sh -c "cat $C 2>/dev/null" || true
          done
          echo "--- odoo 實際生效設定（--stop-after-init 前先印）---"
          docker exec odoo /opt/bitnami/odoo/venv/bin/python -c \
            "import sys; sys.argv=['odoo']; from odoo.tools import config; \
             print({k: config[k] for k in ('workers','limit_memory_hard','limit_memory_soft','max_cron_threads','config','data_dir')})" || true

      - name: R6 - install（不跑測試，計時）
        run: |
          T0=$(date +%s)
          set +e
          docker exec odoo "${ODOO_BIN}" -d test -i woow_paas_platform \
            --stop-after-init --without-demo=all --no-http \
            --limit-memory-hard=0 --max-cron-threads=0 \
            --addons-path="${ADDONS_PATH}" --data-dir=/tmp/odoo-data \
            --db_host "${PG_IP}" --db_user odoo --db_password odoo > /tmp/install.log 2>&1
          RC=$?
          set -e
          T1=$(date +%s)
          echo "MEASURE install_seconds=$((T1-T0)) exit=$RC"
          if [ "$RC" -ne 0 ]; then tail -40 /tmp/install.log; exit "$RC"; fi

      - name: R7 - 全套測試 + skip 盤點 + stats:DEBUG 驗證
        if: ${{ inputs.run_full == 'true' }}
        run: |
          T0=$(date +%s)
          set +e
          docker exec odoo "${ODOO_BIN}" -d test -u woow_paas_platform \
            --test-enable --test-tags /woow_paas_platform \
            --stop-after-init \
            --limit-memory-hard=0 --max-cron-threads=0 \
            --http-port=18069 --gevent-port=18072 \
            --addons-path="${ADDONS_PATH}" --data-dir=/tmp/odoo-data \
            --db_host "${PG_IP}" --db_user odoo --db_password odoo \
            --log-handler=odoo.tests.stats:DEBUG > /tmp/test.log 2>&1
          RC=$?
          set -e
          T1=$(date +%s)
          echo "MEASURE test_seconds=$((T1-T0)) odoo_exit=$RC"

          echo "=== summary 行（沒有這行代表 log 截斷）==="
          grep -E "failed, .* error\(s\) of .* tests" /tmp/test.log || echo "::error::找不到 summary"

          echo "=== ★ SKIP 盤點（summary 完全不會顯示這個）==="
          SKIPS=$({ grep -cE "INFO .*: skipped " /tmp/test.log || true; })
          echo "MEASURE skipped_count=${SKIPS}"
          echo "--- 被 skip 的測試與理由（完整列名，不是只給數字）---"
          { grep -oE "skipped [^:]+ : .*$" /tmp/test.log || true; } \
            | sed 's/[[:space:]]*$//' | sort | uniq -c | sort -rn
          echo "--- 依理由彙總 ---"
          { grep -oE "skipped [^:]+ : .*$" /tmp/test.log || true; } \
            | sed -E 's/^skipped [^:]+ : //' | sed 's/[[:space:]]*$//' | sort | uniq -c | sort -rn

          echo "=== ★ stats:DEBUG 的 Detailed Tests Report 是否真的產出 ==="
          if grep -q "Detailed Tests Report" /tmp/test.log; then
            echo "DETAIL_REPORT_PRESENT=yes"
          else
            echo "DETAIL_REPORT_PRESENT=no  ::error::stats:DEBUG 沒產出報告，G2/G3 設計要改"
          fi
          for G in 1 3 4; do
            N=$({ grep -oE "^\s+[A-Za-z_][A-Za-z0-9_.]*: [0-9.]+s [0-9]+ queries$" /tmp/test.log || true; } \
                 | awk -v g="$G" -F: '{n=split($1,a,"."); if (n==g) c++} END {print c+0}')
            echo "MEASURE detail_lines_granularity_${G}=${N}"
          done
          echo "--- Detailed report 取樣 5 行 ---"
          { grep -E "^\s+[A-Za-z_][A-Za-z0-9_.]*: [0-9.]+s [0-9]+ queries$" /tmp/test.log || true; } | tail -5

          echo "=== 交叉檢查：被 skip 的測試有沒有出現在 detail report 裡（若有 ⇒ G3 差集抓不到 skip）==="
          FIRST_SKIP=$({ grep -oE "skipped [^ ]+ " /tmp/test.log || true; } | head -1 | awk '{print $2}')
          if [ -n "$FIRST_SKIP" ]; then
            echo "取第一個被 skip 的：$FIRST_SKIP"
            { grep -E "\.${FIRST_SKIP}: [0-9.]+s" /tmp/test.log || echo "（不在 detail report 內）"; } | head -3
          else
            echo "本次沒有任何 skip"
          fi

          echo "=== FAIL/ERROR ==="
          { grep -E "^(FAIL|ERROR):" /tmp/test.log || true; } | head -40 || true

      - name: R9 - ★ skip 偵測的陽性對照（注入一個必然 skip 的哨兵）
        run: |
          # run 1432 量到 skipped_count=0。但那個 0 可能是「真的沒 skip」，
          # 也可能是「shell grep 寫錯」——兩者輸出一模一樣，所以那個 0 目前零鑑別力。
          # 這一步注入一個必然 skip + 一個必然通過的哨兵，證明偵測器抓得到。
          cat > /tmp/test_probe_sentinel.py <<'PYEOF'
          from odoo.tests.common import TransactionCase
          from odoo.tests import tagged


          @tagged('post_install', '-at_install')
          class TestProbeSentinel(TransactionCase):
              def test_probe_sentinel_skips(self):
                  # 理由刻意含冒號，對齊 repo 真實樣態（"A.2 prerequisite: ... missing"）
                  self.skipTest("probe sentinel: deliberately skipped")

              def test_probe_sentinel_passes(self):
                  # 陰性對照：這條必須真的跑起來，否則「沒抓到 skip」也可能是整個 class 沒跑
                  self.assertTrue(True)
          PYEOF
          docker cp /tmp/test_probe_sentinel.py "odoo:${MODULE_DIR}/tests/test_probe_sentinel.py"
          docker exec odoo sh -c "printf 'from . import test_probe_sentinel\n' >> ${MODULE_DIR}/tests/__init__.py"

          set +e
          docker exec odoo "${ODOO_BIN}" -d test -u woow_paas_platform \
            --test-enable --test-tags /woow_paas_platform:TestProbeSentinel \
            --stop-after-init --limit-memory-hard=0 --max-cron-threads=0 \
            --http-port=18069 --gevent-port=18072 \
            --addons-path="${ADDONS_PATH}" --data-dir=/tmp/odoo-data \
            --db_host "${PG_IP}" --db_user odoo --db_password odoo \
            --log-handler=odoo.tests.stats:DEBUG > /tmp/sentinel.log 2>&1
          RC=$?
          set -e
          echo "sentinel odoo_exit=$RC"
          echo "--- summary（應為 0 failed, 0 error(s) of 2 tests）---"
          grep -E "failed, .* error\(s\) of .* tests" /tmp/sentinel.log || echo "::error::哨兵沒跑起來"

          echo "--- ★ 用「與全套完全相同的」shell grep 數 skip ---"
          SENT=$({ grep -cE "INFO .*: skipped " /tmp/sentinel.log || true; })
          echo "MEASURE sentinel_skipped_count=${SENT}"

          echo "--- ★ 真實 skip 行的原始樣貌（拿來驗 Python SKIP_LINE）---"
          { grep -E "INFO .*: skipped " /tmp/sentinel.log || true; } | sed 's/^/RAW_SKIP_LINE| /'

          if [ "${SENT}" -ge 1 ]; then
            echo "POSITIVE_CONTROL=pass —— 偵測器抓得到 skip，故全套的 skipped_count=0 是真的 0"
          else
            echo "POSITIVE_CONTROL=FAIL"
            echo "::error::注入了必然 skip 的測試卻數到 0 ⇒ skip 偵測器本身壞了，全套那個 0 不可信"
            exit 1
          fi

      - name: R8 - 收尾
        if: always()
        run: |
          df -h
          docker system df || true
          docker rm -f odoo pg 2>/dev/null || true
