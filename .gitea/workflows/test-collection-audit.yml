# 測試收集完備性稽核（Refs issue #546）
#
# 這支只跑**靜態**檢查（C1 匯入完備性／C1b 純 unittest 模組／C2 baseline 雙向差集），
# 約 1 秒，與觸發策略（全套要在 PR 跑還是 develop push 跑）無關，故先行落地。
# 需要測試 log 的 C3（實際執行清單差集）／C4（skip 盤點）會掛在跑全套的那支上。
#
# 刻意**不併進 repo-lint.yml**：`repo-lint.py` 改動頻繁（045c15aa / ab692d6c /
# b491682d 都動過），多條線同時加 gate 會互相踩；本 gate 自成一支獨立腳本。
#
# ── Phase 1（目前）：warning-only，不擋 merge ───────────────────────────────
# 理由：本 repo 既有先例（docs-link-check.yml 同樣兩階段），且第一次接上去通常不乾淨
# ——目前還有「預期執行 412 vs 實測 415」的 3 個不明項待查（issue #546）。
#
# ⚠ 升級到 Phase 2（移除 continue-on-error）**不綁時間**。
#   「跑一週再改」是時間條件：時間到了不保證問題解決，而且沒有任何機制會在一週後
#   提醒任何人回來改 ⇒ 它會永遠停在 warning-only。**常態 warning 的 gate 等於沒有 gate。**
#
#   改用可判定的狀態，兩者都要滿足（由 gate 自己判定並在滿足時以非零退出碼提醒）：
#     1. baselines/test-collection-known-unexecuted.txt 清空（機制 A／B 都不剩）
#     2. develop push 全套連續 3 次全綠
#   → 見 test_collection_audit.py 的 check_upgrade_readiness()。
name: test-collection-audit

on:
  pull_request:
    paths:
      - "src/tests/**"
      - "scripts/audit/test_collection_audit.py"
      - "scripts/audit/baselines/test-collection*.txt"
      - ".gitea/workflows/test-collection-audit.yml"

jobs:
  test-collection-audit:
    runs-on: ubuntu-latest
    # Phase 1：失敗不擋 merge。升級條件見檔頭（狀態條件，非時間條件）。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # 先打自己：matcher 壞掉時要以「self-test 紅」的形式現形，
      # 而不是以「檢查通過」的形式靜默放行（探針自毀是本 gate 最怕的失效）。
      - name: Self-test（matcher 的邊界樣本）
        run: python3 scripts/audit/test_collection_audit.py --self-test

      - name: C1／C1b／C2 ＋ 升級條件自檢
        id: audit
        run: |
          set +e
          python3 scripts/audit/test_collection_audit.py --all 2>&1 | tee /tmp/audit.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit "$RC"

      - name: 摘要（Phase 1 只警告，但升級提醒要看得到）
        if: always()
        run: |
          echo "## 測試收集完備性稽核（Phase 1 — warning only）" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/audit.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no log)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if grep -q "已滿足升級條件" /tmp/audit.log 2>/dev/null; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### ★ 本 gate 已可升級為 blocking —— 請移除 \`continue-on-error\`" >> "$GITHUB_STEP_SUMMARY"
          fi
