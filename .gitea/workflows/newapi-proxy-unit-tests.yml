# newapi-proxy unit suite（AI 模型分頁，票 LLM-01a）
#
# 純 Python、不連網、不需要叢集：測試直接對 ASGI app 送手工組的 scope，上游是
# httpx.MockTransport；唯一的 socket 是 127.0.0.1 上自己起的 uvicorn。
#
# 用 `paths`（不是 paas-operator-unit-tests.yml 的 paths-ignore）：這個套件自成一體，
# 只有 extra/newapi-proxy/** 與本檔會影響結果。
# 🔴 這支要進 required 清單之前，**必須先刪掉下面兩份 paths**——被過濾掉時 context
#   根本不存在，required 判準湊不齊，只動別處的 PR 會永遠卡住。判準的權威出處是
#   .gitea/workflows/repo-lint.yml 的同一段（#538）。
name: newapi-proxy-unit-tests

on:
  pull_request:
    paths:
      - "extra/newapi-proxy/**"
      - ".gitea/workflows/newapi-proxy-unit-tests.yml"
  push:
    branches:
      - develop
    paths:
      - "extra/newapi-proxy/**"
      - ".gitea/workflows/newapi-proxy-unit-tests.yml"
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 不用 `cache: pip`：理由見 paas-operator-unit-tests.yml 同一段。
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies (hashes)
        working-directory: extra/newapi-proxy
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt

      - name: Run unit tests
        working-directory: extra/newapi-proxy
        run: python -m pytest tests/

      # scripts/signed_request.py 要能在只有 python3 的沙盒 Odoo pod 裡跑：不得 import
      # 標準函式庫以外的東西。
      - name: signed_request.py is stdlib-only
        working-directory: extra/newapi-proxy
        run: python -I -S -c "import runpy, sys; sys.argv=['x','--help']; runpy.run_path('scripts/signed_request.py', run_name='__main__')" >/dev/null

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The job itself runs in an act-runner container. A manually started Docker
    # container on the default bridge is not reachable from that job network.
    services:
      postgres:
        image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: pcadmin
          POSTGRES_PASSWORD: llm12b-ci-only
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U pcadmin -d postgres"
          --health-interval 1s
          --health-timeout 2s
          --health-retries 60
    env:
      PROXY_CONTROL_TEST_DSN: "host=postgres port=5432 dbname=postgres user=pcadmin password=llm12b-ci-only connect_timeout=2"
      REQUIRE_PROXY_CONTROL_TEST: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies (hashes)
        working-directory: extra/newapi-proxy
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt

      - name: Verify isolated PostgreSQL service is reachable
        run: |
          python - <<'PY'
          import os
          import time
          import psycopg
          for attempt in range(30):
              try:
                  with psycopg.connect(os.environ['PROXY_CONTROL_TEST_DSN']):
                      print('isolated PostgreSQL service ready')
                  break
              except psycopg.OperationalError:
                  time.sleep(1)
          else:
              raise SystemExit('isolated PostgreSQL service unreachable')
          PY

      - name: Run real PostgreSQL control-store acceptance
        working-directory: extra/newapi-proxy
        run: python -m pytest tests/integration/test_controlstore_postgres.py -q
