name: manifest-version-gate

# #538：PR 的 manifest 版號必須嚴格大於**當下的** origin/develop。
#
# 為什麼是 CI 而不是 repo-lint.py：repo-lint 是純靜態檢查，這條要比對**遠端當下的值**。
# 而且判準由**排隊順序**決定——rebase 完到真正 merge 之間 develop 可能又被別人 bump 過
# ⇒ 檢查時機必須是「每次 push 都重跑」，不是「rebase 後檢查一次」。
#
# 綠燈過期的缺口，現況（2026-08-06）：**已由 repo 設定收掉，不是由本 workflow 收掉**。
# pull_request 事件只在**本 PR 被 push** 時觸發，別人 merge 進 develop 不會讓本 PR 的
# gate 自動重跑——這一點沒有變，workflow 層也關不掉。真正關掉它的是 develop 分支保護的
# `block_on_outdated_branch=True`：PR 落後 base 就不准 merge ⇒ 必須先 rebase ⇒ rebase
# 的 push 會重跑本 gate ⇒ merge 當下的綠燈必然是對「當下 develop」驗出來的。
# ⚠ 這個閉合**依賴那個設定持續開著**。若哪天 block_on_outdated_branch 被關掉，缺口原樣
# 回來（綠燈可能在 merge 前過期），而且不會有任何訊號。
on:
  pull_request:
    # 🔴 這裡刻意**沒有 paths 白名單**——每一個 PR 都無條件跑。
    #
    # 原本有 `paths: ["src/**", 本檔, "scripts/ci/**"]`，當時的理由是：「gate 的判準只
    # 可能因為 src/ 底下有改動而變紅，沒動 src/ 的 PR 判定必然是 out-of-scope pass
    # ⇒ 不跑它是無損的，不是漏檢。」
    #
    # **那個推理在「本 gate 不是 required status check」的前提下正確；前提一翻轉，結論
    # 就反過來。** Gitea／GitHub 的 required status check 判準是「該 context **存在**
    # 且成功」。paths 沒命中時 workflow 根本不觸發 ⇒ 該 context **不存在**——不是紅也
    # 不是綠。⇒ 設成 required 之後，純 docs PR 會永遠缺一個 check、**永遠不能 merge**。
    # 「不跑它是無損的」在 required 之後變成「不跑它就卡死」。
    #
    # 實證（不是推論）：PR#599 的 head `5098936d` 只動了 .gitea/ 與 scripts/ci/，該
    # commit 的 statuses **只有 manifest-version-gate 一個 context**——repo-lint 與
    # lychee 這兩個 workflow 當時都存在於 repo，卻因 paths 沒命中而完全沒有留下 context。
    #
    # 代價：每個 PR 多跑約 7 秒。行為不變——沒動 src/ 的 PR 本來就會判 out-of-scope
    # pass（見 scripts/ci/manifest-version-gate.py :: classify_bump_requirement），
    # 差別只在「有沒有留下一個 context 讓 required check 看得到」。
    #
    # 什麼時候可以改回白名單：**只有在本 gate 不再是 required status check 時。**
    # 在那之前，加任何 paths／branches 過濾都等同於讓所有被過濾掉的 PR 無法合併。

jobs:
  manifest-version-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（PR head，不是 merge 結果）
        uses: actions/checkout@v4
        with:
          # 🔴 fetch-depth: 0 是必要的，不是效能取捨。
          # shallow clone 算不出 merge-base ⇒ 無從得知本 PR 到底動了哪些檔案。
          # gate 偵測到 shallow 會直接 fail-loud（刻意不退回「猜一個檔案清單」）。
          fetch-depth: 0
          # 刻意檢查 PR 自己的 head 而不是預設的 merge 結果：gate 的判準是
          # 「**作者寫下的版號**是否嚴格大於 develop」。檢查 merge 結果的話，
          # 「PR 低於 develop」那種情形會先在 merge ref 生成階段變成衝突或被 base 覆蓋，
          # gate 看到的就不是作者實際寫的值了。
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 取回 base 分支
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"

      # 🔴 先自測再判 PR。理由（#538 驗收段）：一道從沒被看過會失敗的檢查，
      # 與一道什麼都沒檢查的檢查，輸出長得一模一樣。這一步把「上線時驗過一次」
      # 升級成「每次跑都重新證明比較器還活著」——特別是跨百位那兩個方向。
      - name: 自測（比較器 + 三點 diff + 豁免判準）
        run: python3 scripts/ci/test_manifest_version_gate.py

      - name: 檢查 manifest 版號嚴格遞增
        run: |
          python3 scripts/ci/manifest-version-gate.py \
            --base-ref "origin/${{ github.event.pull_request.base.ref }}"
