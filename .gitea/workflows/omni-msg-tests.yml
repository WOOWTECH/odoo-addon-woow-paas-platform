name: omni-msg-tests

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  messaging-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test CLI, bridge and fake Omnigent contract
        run: python -m unittest discover -s .omnigent/omni-msg/tests -v
      - name: Verify installed entry point
        run: |
          python -m pip install ./.omnigent/omni-msg
          omni-msg --help
